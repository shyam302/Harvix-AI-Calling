<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0f766e; --accent-soft: #e6f4f2; --you: #eef2ff; --bot: #f3f4f6; --warn: #b45309; --rec: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1a1f26; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a313b;
      --accent: #2dd4bf; --accent-soft: #12302d; --you: #1e2440; --bot: #232a33; --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 20px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  .pill { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--bot); color: var(--muted); }
  .pill.listening { background: var(--accent-soft); color: var(--accent); }
  .pill.typing { background: var(--bot); color: var(--text); }
  .pill.speaking { background: var(--you); color: var(--text); }
  .pill.thinking { background: #fef3c7; color: #92400e; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  #start { padding: 22px; display: grid; gap: 12px; }
  #start p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
  button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { background: var(--bg); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .primary:hover { background: var(--accent); filter: brightness(1.08); }
  .danger { color: var(--rec); border-color: var(--rec); }
  #chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .msg { padding: 9px 13px; border-radius: 14px; max-width: 85%; overflow-wrap: anywhere; }
  .msg.you { background: var(--you); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.note { align-self: center; background: none; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .controls form { display: flex; gap: 8px; flex: 1; min-width: 220px; }
  .controls input { flex: 1; min-width: 0; }
  #mic { width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--accent); border-color: var(--accent); color: #fff; }
  #mic.muted { background: var(--muted); border-color: var(--muted); }
  #spk { width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
  #spk svg { width: 22px; height: 22px; }
  #spk:not(.muted) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #spk.muted .waves, #spk:not(.muted) .cross { display: none; }
  #mic svg { width: 22px; height: 22px; }
  .meter { width: 70px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #level { height: 100%; width: 0; background: var(--accent); transition: width .08s; }
  #keypad { display: none; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; padding: 10px; border-top: 1px solid var(--line); }
  #keypad.open { display: grid; }
  #keypad button { height: 44px; font-size: 18px; font-variant-numeric: tabular-nums; }
  .error { color: var(--warn); }
  @media (max-width: 520px) { .msg { max-width: 92%; } }
  /* inside the portal's side panel */
  .embed main { max-width: none; padding: 10px; gap: 8px; }
  .embed h1 { font-size: 16px; }
  .embed .controls form { min-width: 0; flex-basis: 100%; order: -1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Voice assistant</h1>
    <span class="pill" id="state">Not connected</span>
  </header>

  <section class="card" id="start">
    <p>Chat with the assistant by typing. Switch on the microphone 🎤 any time to talk instead; it then answers aloud. It's the same assistant as on the phone line: questions, complaints, complaint status.</p>
    <label>Your registered phone number (optional, so the assistant knows you; you'll be asked for your PIN)
      <input id="phone" inputmode="tel" placeholder="e.g. 1001" autocomplete="tel">
    </label>
    <div><button class="primary" id="go">Start conversation</button></div>
    <p id="startError" class="error"></p>
  </section>

  <section class="card" id="chat">
    <div id="log"></div>
    <div id="keypad"></div>
    <div class="controls">
      <button id="mic" class="muted" title="Turn the microphone on to talk" aria-label="Turn microphone on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="spk" class="muted" title="Speaker off: replies are text only. Click to hear them." aria-label="Turn speaker on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="cross" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
      <div class="meter" title="Microphone level"><div id="level"></div></div>
      <form id="typeForm"><input id="typed" placeholder="Or type a message…" autocomplete="off"><button>Send</button></form>
      <button id="kp" title="Keypad for your PIN">Keypad</button>
      <button id="end" class="danger">End</button>
      <button id="newChat" title="Clear this conversation and start fresh">New conversation</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let ws, ctx, stream, node, source, voiceOn = false;
let pendingAudioId = null, playing = null, queue = [];

const STATES = { connected: "Connected", typing: "Chat", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking" };
function setState(s) { const p = $("state"); p.textContent = STATES[s] || s; p.className = "pill " + s; }
// Chat history for as long as this browser tab is open (shared by all portal pages,
// survives page switches and refreshes; cleared when the tab closes or "New conversation").
const HKEY = "assistantChat.history", PKEY = "assistantChat.phone", SKEY = "assistantChat.speaker";
let speakerOn = sessionStorage.getItem(SKEY) === "1";

// Speaker: spoken replies on/off (independent of the microphone)
function setSpeaker(on, note = true) {
  speakerOn = on;
  try { sessionStorage.setItem(SKEY, on ? "1" : "0"); } catch {}
  if (!on) stopAudio();
  if (connected()) ws.send(JSON.stringify({ type: "speaker", on }));
  const b = $("spk");
  b.classList.toggle("muted", !on);
  b.setAttribute("aria-label", on ? "Turn speaker off" : "Turn speaker on");
  b.title = on ? "Speaker on: replies are spoken. Click to read only." : "Speaker off: replies are text only. Click to hear them.";
  if (note) add("note", on ? "Speaker on: replies are spoken." : "Speaker off: replies are text only.");
}
function loadHistory() { try { return JSON.parse(sessionStorage.getItem(HKEY) || "[]"); } catch { return []; } }
function saveHistory(h) { try { sessionStorage.setItem(HKEY, JSON.stringify(h.slice(-200))); } catch {} }
function render(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("log").append(d); $("log").scrollTop = $("log").scrollHeight;
}
function add(cls, text) {
  render(cls, text);
  const h = loadHistory(); h.push({ role: cls, text }); saveHistory(h);
}

// Mic samples -> 16 kHz PCM16 every ~40 ms (AudioWorklet runs on the audio thread)
const worklet = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) { this.buf.push(ch.slice()); this.n += ch.length; }
    if (this.n >= sampleRate / 25) {
      const out = new Float32Array(this.n); let o = 0;
      for (const b of this.buf) { out.set(b, o); o += b.length; }
      this.port.postMessage(out, [out.buffer]); this.buf = []; this.n = 0;
    }
    return true;
  }
}
registerProcessor("tap", Tap);`;

function toPcm16(f32, rate) {
  const ratio = rate / 16000, n = Math.floor(f32.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, f32[Math.floor(i * ratio)]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

// Bot audio: one <audio> per chunk, played in order (keeps the browser's echo cancellation working)
function playNext() {
  if (playing || !queue.length) return;
  const { id, blob } = queue.shift();
  const url = URL.createObjectURL(blob);
  const a = new Audio(url);
  playing = { id, a, url };
  const done = () => {
    if (!playing || playing.a !== a) return;
    URL.revokeObjectURL(url); playing = null;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "played", id }));
    playNext();
  };
  a.onended = done; a.onerror = done;
  a.play().catch(done);
}
function stopAudio() {
  queue = [];
  if (playing) { playing.a.pause(); URL.revokeObjectURL(playing.url); playing = null; }
}

function connected() { return ws && ws.readyState === 1; }

async function connect() {
  if (connected()) return true;
  $("startError").textContent = "";
  const phone = (sessionStorage.getItem(PKEY) || "").trim();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.binaryType = "blob";
  ws.onmessage = ev => {
    if (typeof ev.data !== "string") {
      if (pendingAudioId !== null) { queue.push({ id: pendingAudioId, blob: ev.data }); pendingAudioId = null; playNext(); }
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === "audio") pendingAudioId = m.id;
    else if (m.type === "bot") add("bot", m.text);
    else if (m.type === "you") add("you", m.text);
    else if (m.type === "state") setState(m.state);
    else if (m.type === "stop") stopAudio();
    else if (m.type === "error") add("note", m.text);
    else if (m.type === "end") { add("note", "Conversation ended. Type to continue, or start a new conversation."); finish(); }
  };
  ws.onclose = () => { if (voiceOn) micOff(false); setState("Ended"); };
  const ok = await new Promise(res => { ws.onopen = () => res(true); ws.onerror = () => res(false); });
  if (!ok) { $("startError").textContent = "Could not reach the assistant. Is the bot running?"; return false; }
  // The earlier conversation of this tab goes to the bot, so it remembers it.
  const history = loadHistory().filter(m => m.role === "you" || m.role === "bot").slice(-20);
  ws.send(JSON.stringify({ type: "start", phone, history }));
  ws.send(JSON.stringify({ type: "speaker", on: speakerOn }));
  return true;
}

function showChat() { $("start").style.display = "none"; $("chat").style.display = "flex"; }

async function start() {
  sessionStorage.setItem(PKEY, $("phone").value.trim());
  if (!(await connect())) return;
  showChat(); $("typed").focus();
}

// Microphone: only when the user switches it on (the chat itself is text-only)
async function micOn() {
  if (!(await connect())) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    add("note", "Microphone not available: " + e.message + (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1" ? " (the browser only allows the mic on https or localhost)" : ""));
    return;
  }
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "text/javascript" })));
  source = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "tap");
  node.port.onmessage = ev => {
    const f32 = ev.data;
    let sum = 0; for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    $("level").style.width = Math.min(100, Math.sqrt(sum / f32.length) * 400) + "%";
    if (voiceOn && ws && ws.readyState === 1) ws.send(toPcm16(f32, ctx.sampleRate).buffer);
  };
  source.connect(node);
  voiceOn = true;
  ws.send(JSON.stringify({ type: "voice", on: true }));
  if (!speakerOn) setSpeaker(true, false);   // talking: hear the replies too (can turn off)
  $("mic").classList.remove("muted"); $("mic").setAttribute("aria-label", "Turn microphone off");
  $("mic").title = "Microphone on: talk, the assistant answers aloud. Click to turn off.";
  add("note", "Microphone on: talk any time. Speaker 🔊 controls whether replies are spoken.");
}

function micOff(note = true) {
  voiceOn = false;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "voice", on: false }));
  node?.disconnect(); source?.disconnect(); ctx?.close(); node = source = ctx = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null;   // browser mic indicator goes off
  stopAudio();
  $("level").style.width = "0";
  $("mic").classList.add("muted"); $("mic").setAttribute("aria-label", "Turn microphone on");
  $("mic").title = "Turn the microphone on to talk";
  if (note) add("note", "Microphone off: chat by typing.");
}

function finish() {
  if (voiceOn) micOff(false); else stopAudio();
  if (ws && ws.readyState === 1) ws.close();
  setState("Ended");   // history stays; typing reconnects and continues
}

function newConversation() {
  if (connected()) { ws.send(JSON.stringify({ type: "hangup" })); ws.close(); }
  try { sessionStorage.removeItem(HKEY); sessionStorage.removeItem(PKEY); } catch {}
  location.reload();
}

if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
$("go").onclick = start;
$("phone").onkeydown = e => { if (e.key === "Enter") start(); };
$("mic").onclick = () => (voiceOn ? micOff() : micOn());
$("typeForm").onsubmit = async e => {
  e.preventDefault();
  const t = $("typed").value.trim();
  if (!t) return;
  $("typed").value = "";
  if (!connected()) {                 // after "End", a refresh or a page switch: continue
    if (!(await connect())) { $("typed").value = t; return; }
    await new Promise(r => setTimeout(r, 400));   // let the bot's short "go ahead" arrive first
  }
  stopAudio(); add("you", t);
  ws.send(JSON.stringify({ type: "text", text: t }));
};
$("end").onclick = () => { if (connected()) ws.send(JSON.stringify({ type: "hangup" })); finish(); };
$("newChat").onclick = newConversation;
$("spk").onclick = () => setSpeaker(!speakerOn);
setSpeaker(speakerOn, false);

// Reopened page / switched portal page: show this tab's conversation and continue on demand.
(() => {
  const h = loadHistory();
  if (!h.length) return;
  for (const m of h) render(m.role, m.text);
  showChat(); setState("Not connected");
})();
$("kp").onclick = () => $("keypad").classList.toggle("open");
for (const k of ["1","2","3","4","5","6","7","8","9","*","0","#"]) {
  const b = document.createElement("button"); b.textContent = k;
  b.onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "dtmf", digit: k })); };
  $("keypad").append(b);
}
</script>
</body>
</html>
