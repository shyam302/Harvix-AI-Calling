[general]
static=yes
writeprotect=no

[from-internal-app]
; Phones dial BOT_EXTENSION (docker/.env) to reach the Python ARI app
exten => ${BOT_EXTENSION},1,NoOp(Voice LLM via ARI)
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; Phone-to-phone test: 1001 can call 1002 and back
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
