[general]
static=yes
writeprotect=no

[from-internal-app]
; Phones dial BOT_EXTENSION (docker/.env) to reach the Python ARI app
exten => ${BOT_EXTENSION},1,NoOp(Voice LLM via ARI)
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; Phone to phone: any 4-digit extension 1000-1999 from PHONES (1001 calls 1003, …)
exten => _1XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
