[general]
static=yes
writeprotect=no

[from-internal-app]
; Dial 7001 to talk to the Python ARI app (STASIS_APP=callbot in .env)
exten => 7001,1,NoOp(Voice LLM via ARI)
 same => n,Stasis(callbot)
 same => n,Hangup()

; Phone-to-phone test: 1001 can call 1002 and back
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
