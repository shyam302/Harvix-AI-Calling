; PJSIP accounts come from two places:
;   1. pjsip.conf  - the phones in PHONES (docker/.env), read-only here
;   2. astdb       - phones added from the web page (/customers -> Phones), created at
;                    runtime through ARI (PUT /ari/asterisk/config/dynamic/res_pjsip/...)
;                    and kept in the asterisk-db volume across restarts.
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=astdb,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=astdb,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=astdb,ps_aors
