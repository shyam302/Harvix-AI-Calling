; Softphones: listed in PHONES in docker/.env (extension:password). Change passwords before exposing this.
; Phones dial BOT_EXTENSION (default 7001) to reach the bot.
;
; Tailscale / NAT: set EXTERNAL_IP in docker/.env (render.sh adds the external_* lines).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_PORT}
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=100.64.0.0/10

[phone](!)
type=endpoint
transport=transport-udp
context=from-internal-app
disallow=all
allow=${CODECS}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[aor-tpl](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

; ---- phone accounts -------------------------------------------------------------
; Generated by render.sh from PHONES in docker/.env, e.g.
;   PHONES=1001:secret1,1002:secret2,1003:secret3      (extension:password)
; Each one becomes an auth + aor + endpoint using the templates above.
