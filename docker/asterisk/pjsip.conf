; Softphones 1001 and 1002 (passwords in docker/.env). Change passwords before exposing this.
; Phones dial BOT_EXTENSION (default 7001) to reach the bot.
;
; Tailscale / NAT: set EXTERNAL_IP in docker/.env (render.sh adds the external_* lines).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_PORT}
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=100.64.0.0/10

[phone](!)
type=endpoint
transport=transport-udp
context=from-internal-app
disallow=all
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[aor-tpl](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

[1001]
type=auth
auth_type=userpass
username=1001
password=${PHONE_1001_PASSWORD}

[1001](aor-tpl)

[1001](phone)
auth=1001
aors=1001

[1002]
type=auth
auth_type=userpass
username=1002
password=${PHONE_1002_PASSWORD}

[1002](aor-tpl)

[1002](phone)
auth=1002
aors=1002
