# Asterisk in Docker for the call bot (image: andrius/asterisk).
#
#   cd docker && docker compose up -d
#
# Host networking: SIP (5060/udp), RTP (10000-10100/udp) and ARI (8088) appear
# directly on this machine, and the bot's externalMedia RTP to 127.0.0.1 works.
# Stop the system Asterisk first (sudo systemctl stop asterisk): both want 5060/8088.
services:
  asterisk:
    image: andrius/asterisk:22.11.0_debian-trixie
    container_name: callbot-asterisk
    network_mode: host
    restart: unless-stopped
    environment:
      PUID: "1000"               # match your user (id -u) so mounted dirs are writable
      PGID: "1000"
      ASTERISK_TERMINAL_OPTS: "-n"   # no colour codes in docker logs
    volumes:
      # Only the files we change; everything else keeps the image defaults.
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      # The bot writes TTS WAVs here (ASTERISK_SOUNDS_EN in .env) and Asterisk plays them.
      - ./data/sounds:/var/lib/asterisk/sounds/en
      - ./data/logs:/var/log/asterisk
