; EXAMPLE ONLY — change SIP passwords before production or public deploy.
; LAN softphone (extensions 1001, 1002) + Stasis LLM app.
; In /etc/asterisk/pjsip.conf add: #include pjsip_lan_callbot.conf
;
; Deploy to the Asterisk host (config on disk is what matters, not only the git copy):
;   sudo cp /path/to/Asterisk_Call/asterisk_snippets/pjsip_lan_callbot.conf /etc/asterisk/
;   sudo asterisk -rx "pjsip reload"
;   sudo asterisk -rx "pjsip show endpoint 1002"
; If 1002 is "Unknown" or missing, this file was not copied/reloaded or #include is wrong.
;
; If ANOTHER file already defines [transport-udp], delete the [transport-udp] block below
; (lines until first [1001]) and set transport= on each endpoint to that transport's name
; (see: sudo asterisk -rx "pjsip show transports").
;
; Tailscale / NAT / one-way audio (greeting OK, mic silent):
;   On the Asterisk host run:  tailscale ip -4
;   Under [transport-udp] below, set external_media_address and external_signaling_address
;   to that IPv4 (the address softphones use as SIP "Server" / registrar).
;   Add local_net= for each private range that should NOT trigger rewriting (LAN + Tailscale):
;     local_net=192.168.0.0/16
;     local_net=100.64.0.0/10
;   Then: sudo asterisk -rx "pjsip reload"
;
; "NonQual" on Contact: normal if OPTIONS qualify is off. Enable qualify on the [1001] AOR
; with qualify_frequency=60 to see RTT; firewall must allow Asterisk -> phone UDP replies.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; Classify private/LAN + CGNAT (Tailscale) as on-link. Add more local_net= lines if needed.
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=100.64.0.0/10
; Uncomment and set to THIS host's IPv4 that phones dial (e.g. Tailscale IP from `tailscale ip -4`):
;external_media_address=100.x.x.x
;external_signaling_address=100.x.x.x

[1001]
type=auth
auth_type=userpass
username=1001
password=1001

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

[1001]
type=endpoint
transport=transport-udp
context=from-internal-app
disallow=all
allow=ulaw,alaw,g722
auth=1001
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Second phone: register as user 1002 / password 1002 (must match auth below).
; Softphone fields: "User" / "SIP user" / "Authorization name" = 1002 (not 1001).

[1002]
type=auth
auth_type=userpass
username=1002
password=1002

[1002]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

[1002]
type=endpoint
transport=transport-udp
context=from-internal-app
disallow=all
allow=ulaw,alaw,g722
auth=1002
aors=1002
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
